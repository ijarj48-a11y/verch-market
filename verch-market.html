<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VERCH MARKET — Prototype</title>
<style>
:root{color-scheme:dark;--bg:#0b0f17;--cd:#121826;--ln:#1d2636;--tx:#e6ebf5;--mu:#7b8aa3;--g:#16c784;--r:#ea3943;--b:#3b82f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#hd{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--ln);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#main{max-width:640px;margin:0 auto;padding:12px 14px}
#hd>div,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{letter-spacing:.5px}.logo span{color:var(--b)}
.open{font-size:11px;color:var(--g)}.open i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:5px}
.vs{font-size:26px;font-weight:700}.vs small{font-size:15px;margin-left:6px}
.sm{font-size:12px;color:var(--mu)}.big{font-size:24px;font-weight:700}
.up{color:var(--g)}.dn{color:var(--r)}.flat{color:var(--mu)}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid currentColor}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.card .row{margin:6px 0}
.sec{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin:16px 2px 8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mini{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px}
.mini b{display:block;font-size:15px;margin-top:2px}
.st{display:flex;justify-content:space-between;align-items:center;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.st .r{text-align:right}.st b{font-size:15px}
canvas{width:100%;height:310px;display:block;margin-top:6px;border-radius:10px;background:#141622}
body.tr{overflow:hidden;padding-bottom:0}
#main.tr{position:fixed;left:0;right:0;margin:0 auto;max-width:640px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.cw{flex:1;min-height:0;position:relative}.cw canvas{position:absolute;inset:0;height:100%;margin:0}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bx{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:6px 10px;text-align:center;display:flex;flex-direction:column;gap:1px;justify-content:center}
.bx input{width:100%;min-width:0;background:none;border:0;text-align:center;font-weight:700;font-size:18px;padding:2px}
.bx .row{margin:0}.bx button{padding:6px 12px}
select,input{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:15px}
.qty{display:flex;gap:6px}.qty input{width:90px;text-align:center}
button{font:inherit;cursor:pointer;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.b{font-weight:700;font-size:16px;padding:13px;border:0;color:#fff}.buy{background:var(--g)}.sell{background:var(--r)}
.star{color:var(--mu);font-size:18px;margin-right:10px}.star.on{color:#f5c542}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mu);font-weight:500}
.nw{background:var(--cd);border-left:3px solid var(--b);border-radius:8px;padding:10px 12px;margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0e1420;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;border-radius:0;padding:14px 0;font-size:9.5px;min-width:0;font-weight:600;color:var(--mu)}
nav button.on{color:var(--b);box-shadow:inset 0 2px 0 var(--b)}
.lm{background:var(--cd);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px}.lm summary{padding:12px;font-weight:600;cursor:pointer}.lm ul{margin:0;padding:0 14px 12px 30px;color:#c4cce0}.lm li{margin:6px 0}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cg label{font-size:12px;color:var(--mu)}.cg input{width:100%;margin-top:3px}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.pill{display:inline-block;min-width:62px;text-align:center;padding:3px 6px;border-radius:6px;font-size:12px;font-weight:600;color:#fff}.pu{background:#16c784}.pd{background:#ea3943}
.seg{display:flex;background:var(--cd);border-radius:10px;padding:3px;margin:14px 0 4px}.seg button{flex:1;border:0;background:none;padding:9px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--b);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chip{flex:none;min-width:104px;cursor:pointer}.st>div:first-child{flex:1;min-width:0}.st svg{flex:none;margin:0 10px}
nav svg{display:block;margin:0 auto 3px}
.tfs{display:inline-flex;gap:4px}.tfs button{padding:3px 9px;font-size:12px;border-radius:6px}.tfs button.on{background:var(--b);border-color:var(--b);color:#fff}.cw .tfs{position:absolute;top:6px;left:8px;z-index:2}
button:disabled{opacity:1;color:var(--tx)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#1c2740;border:1px solid var(--b);padding:10px 16px;border-radius:10px;z-index:9;display:none;max-width:90%;text-align:center}
</style></head><body>
<div id="hd"></div><div id="main"></div><div id="toast"></div>
<nav id="nv"></nav>
<script>
const $=id=>document.getElementById(id);
const rn=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*Math.random())};
const fR=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const fS=n=>(n>0.5?'+':n<-0.5?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const fP=(n,s)=>(s&&n>0?'+':'')+n.toFixed(2).replace('.',',')+'%';
const cl=n=>n>0?'up':n<0?'dn':'flat';
const TPC=4,T0=780,G='#16c784',RD='#ea3943';
const DEF=[['TG40','TG40 Holdings','Teknologi',2631000,1.3,1.4],['VRC','Verch Capital','Keuangan',485000,.9,.8],['NOVA','Nova Energy','Energi',12750,1.1,1.6],['ARVX','Arvex Robotics','Teknologi',87400,1.5,1.9],['VERA','Vera Health','Kesehatan',264000,.6,.7],['ZENT','Zenith Retail','Konsumer',5320,.8,1],['KRYO','Kryo Mining','Pertambangan',1480000,1.7,2.2],['BTC','Bitcoin · 0,001 BTC/lot','Crypto',1580000,.5,2.4],['ETH','Ethereum · 0,01 ETH/lot','Crypto',584000,.6,2.8],['SOL','Solana · 0,1 SOL/lot','Crypto',295000,.7,3.4],['BNB','BNB · 0,1 BNB/lot','Crypto',1020000,.5,2.2],['XRP','XRP · 10 XRP/lot','Crypto',368000,.4,3],['DOGE','Dogecoin · 100 DOGE/lot','Crypto',265000,.8,4.2],['XAU','Emas Dunia XAU · 0,1 oz/lot','Emas',6800000,-.35,.8]];
const RGS={BULLISH:{d:.03,v:.09,n:[40,70]},BEARISH:{d:-.03,v:.09,n:[40,70]},SIDEWAYS:{d:0,v:.05,n:[30,50]},KOREKSI:{d:-.14,v:.12,n:[8,14]},RALLY:{d:.14,v:.12,n:[8,14]}};
const RC={BULLISH:'up',RALLY:'up',BEARISH:'dn',KOREKSI:'dn',SIDEWAYS:'flat'};
const NW={BULLISH:'VSG continues to strengthen as global market sentiment improves.',BEARISH:'VSG slips as investors turn cautious across global markets.',SIDEWAYS:'VSG moves sideways as traders wait for a clear signal.',KOREKSI:'Market correction hits VSG as profit-taking accelerates.',RALLY:'Market rally lifts VSG as buying pressure surges.'};
let S,V,stocks,REG,RG,TM;
function mk(t,name,sec,p,beta,vol){const c=[];let pc=p;for(let i=0;i<300;i++){const o=pc/(1+rn()*.004*(vol||1)),h=Math.max(o,pc)*(1+Math.random()*.002),l=Math.min(o,pc)*(1-Math.random()*.002);c.unshift({o,h,l,c:pc,v:50+Math.random()*100,t:T0-i});pc=o}
 c.push({o:p,h:p,l:p,c:p,v:0,t:T0+1});return{t,name,sec,p,o:p,beta,vol,c,n:0,snap:p}}
function init(){S={cat:'Saham',cash:1e8,hold:{},hist:[],page:'market',sel:'TG40',qty:1,speed:1,pause:0,news:[],tick:0,dayEq:1e8,watch:['TG40','VRC','NOVA']};
 V=mk('VSG','Verch Stock Global Index','Indeks',3698.70,1,1);V.o=3698.70/1.2613;V.pi=3698.70;
 stocks=DEF.map(d=>mk(...d));stocks.forEach(s=>s.o=s.p/(1+rn()*.01+.003));
 REG=[['Asia',4.52,.17],['Europe',3.34,.13],['North America',5.02,.19],['South America',2.57,.10],['Africa',1.96,.08],['Oceania',3.29,.12]].map(r=>({n:r[0],b:r[1],k:r[2],off:0,v:r[1]}));
 RG={};setRG('BULLISH');S.news=[];addNews('VSG continues to strengthen as global market sentiment improves.');addNews('TG40 gains momentum following strong VSG performance.');
 go('market');rs()}
function setRG(k){const r=RGS[k];RG={k,d:r.d,v:r.v,left:r.n[0]+Math.random()*(r.n[1]-r.n[0])|0};if(S&&S.tick)addNews(NW[k])}
function nextRG(){let w=(RG.k=='KOREKSI'||RG.k=='RALLY')?['BULLISH','BEARISH','SIDEWAYS']:['BULLISH','BEARISH','SIDEWAYS','KOREKSI','RALLY'];w=w.filter(x=>x!=RG.k);setRG(w[Math.random()*w.length|0])}
function addNews(t){S.news.unshift({t,tm:new Date().toLocaleTimeString('id-ID')});S.news.length=Math.min(S.news.length,30)}
function upc(s){const c=s.c[s.c.length-1];c.c=s.p;c.h=Math.max(c.h,s.p);c.l=Math.min(c.l,s.p);c.v+=20+Math.random()*60;if(++s.n%TPC==0)s.c.push({o:s.p,h:s.p,l:s.p,c:s.p,v:0,t:c.t+1})}
function step(){S.tick++;if(--RG.left<=0)nextRG();
 const vr=RG.d+RG.v*rn();V.p*=1+vr/100;upc(V);
 stocks.forEach(s=>{s.p=Math.max(100,s.p*(1+(s.beta*vr+s.vol*.08*rn())/100));upc(s)});
 REG.forEach(r=>{r.v+=-r.v*.06+r.k*5.5*3*vr+rn()*.04});
 if(S.tick%14==0){let b=null,m=0;stocks.forEach(s=>{const x=s.p/s.snap-1;if(Math.abs(x)>m){m=Math.abs(x);b=[s,x]}s.snap=s.p});
  if(b)addNews(b[1]>0?b[0].t+' gains momentum following strong VSG performance.':b[0].t+' comes under pressure as VSG weakens.')}}
const ST=t=>stocks.find(s=>s.t==t);
function M(){const pv=Object.entries(S.hold).reduce((a,[t,h])=>a+h.q*ST(t).p,0),eq=S.cash+pv;return{pv,eq,today:eq-S.dayEq,total:eq-1e8}}
function H(){const c=(V.p/V.o-1)*100;$('hd').innerHTML=`<div><b class=logo>VERCH <span>MARKET</span></b><span class=open><i></i>MARKET OPEN${API?(ON?' · SERVER ONLINE':' · OFFLINE'):''}${S.pause?' · PAUSE':''}</span></div><div><div><div class=sm>VSG — Verch Stock Global Index</div><div class="vs ${cl(c)}">${V.p.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})}<small>${fP(c,1)}</small></div></div><span class="tag ${RC[RG.k]}">${RG.k}</span></div>`}
function drawOld(cv,s){if(!cv)return;const d=devicePixelRatio||1,W=cv.clientWidth,Ht=cv.clientHeight;cv.width=W*d;cv.height=Ht*d;const g=cv.getContext('2d');g.scale(d,d);
 const N=36,cs=s.c.slice(-N),pw=70,ch=Ht-22,ph=ch*.76,vh=ch-ph-8;let hi=Math.max(...cs.map(c=>c.h)),lo=Math.min(...cs.map(c=>c.l));const pad=(hi-lo)*.1||1;hi+=pad;lo-=pad;
 const y=p=>ph*(1-(p-lo)/(hi-lo)),cw=(W-pw)/N,mv=Math.max(...cs.map(c=>c.v))||1,fm=p=>s.t=='VSG'?p.toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1}):Math.round(p).toLocaleString('id-ID');
 g.font='10px sans-serif';g.textBaseline='middle';
 for(let i=0;i<=4;i++){const p=lo+(hi-lo)*i/4,yy=y(p);g.strokeStyle='#1d2636';g.beginPath();g.moveTo(0,yy);g.lineTo(W-pw,yy);g.stroke();g.fillStyle='#7b8aa3';g.textAlign='right';g.fillText(fm(p),W-4,yy)}
 cs.forEach((c,i)=>{const x=i*cw+cw/2,up=c.c>=c.o,col=up?G:RD;g.strokeStyle=g.fillStyle=col;g.beginPath();g.moveTo(x,y(c.h));g.lineTo(x,y(c.l));g.stroke();
  const t=y(Math.max(c.o,c.c)),bh=Math.max(1,Math.abs(y(c.o)-y(c.c)));g.fillRect(x-cw*.3,t,cw*.6,bh);
  g.globalAlpha=.4;const vv=vh*c.v/mv;g.fillRect(x-cw*.3,ph+8+vh-vv,cw*.6,vv);g.globalAlpha=1;
  if(i%6==0){const m=c.t;g.fillStyle='#7b8aa3';g.textAlign='center';g.fillText(String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),x,Ht-8)}});
 const cy=y(s.p),up=s.p>=s.o;g.setLineDash([4,3]);g.strokeStyle=up?G:RD;g.beginPath();g.moveTo(0,cy);g.lineTo(W-pw,cy);g.stroke();g.setLineDash([]);
 g.fillStyle=up?G:RD;g.fillRect(W-pw,cy-9,pw,18);g.fillStyle='#fff';g.textAlign='center';g.fillText(fm(s.p),W-pw/2,cy)}
const rowOld=s=>{const c=(s.p/s.o-1)*100;return`<div class=st onclick="go('trade','${s.t}')"><div><b>${s.t}</b><div class=sm>${s.name} · ${s.sec}</div><div class=sm>β ${s.beta} · vol ${s.vol}</div></div><div class=r><b>${fR(s.p)}</b><div class=${cl(c)}>${fP(c,1)}</div></div></div>`};
function pM(){return`<div class=card><div class=row><b>VSG</b>${TFB()}</div><canvas id=cv></canvas></div><div id=mv>${pMv()}</div>`}
function pMv(){const m=M();return`<div class=grid2><div class=mini><span class=sm>Total Equity</span><b>${fR(m.eq)}</b></div><div class=mini><span class=sm>Total P/L</span><b class=${cl(m.total)}>${fS(m.total)}</b></div></div>
<div class=sec>Pasar Global</div><div class=grid3>${REG.map(r=>{const v=r.v;return`<div class=mini style="background:${v>=0?'rgba(22,199,132,.10)':'rgba(234,57,67,.16)'}"><span class=sm>${r.n}</span><b class=${cl(v)}>${v>=0?'▲':'▼'} ${fP(v,1)}</b></div>`}).join('')}</div>
${ML()}
<div class=sec>Kontrol Simulasi</div><div class=btns><button onclick="sc('RALLY')">Market Rally</button><button onclick="sc('KOREKSI')">Market Correction</button><button onclick="sc('SIDEWAYS')">Sideways</button><button onclick="sc('BEARISH')">Bearish</button><button onclick="sc('BULLISH')">Bullish</button><button onclick="S.pause^=1;rs();R()">${S.pause?'Lanjut':'Pause'}</button><button onclick="S.speed=S.speed==1?3:S.speed==3?6:1;rs();R()">Kecepatan ${S.speed}x</button><button onclick="setAPI()">Server</button><button onclick="SND^=1;snd('buy');R()">Suara ${SND?'ON':'OFF'}</button><button onclick="nd()">Hari Baru</button><button onclick="if(confirm('Reset demo?'))init()">Reset Demo</button></div>`}
function pW(){const w=stocks.filter(s=>S.watch.includes(s.t)),o=stocks.filter(s=>!S.watch.includes(s.t));const r=s=>`<div style="display:flex;align-items:center"><span class="star ${S.watch.includes(s.t)?'on':''}" onclick="tw('${s.t}')">★</span><div style="flex:1">${row(s)}</div></div>`;return`<div class=sec>Watchlist</div>${w.map(r).join('')||'<div class=sm>Kosong. Tap ★ untuk menambah.</div>'}<div class=sec>Saham Lain</div>${o.map(r).join('')}`}
function pTold(){const s=ST(S.sel);return`<div class=card><select onchange="S.sel=this.value;R()">${stocks.map(x=>`<option ${x.t==s.t?'selected':''}>${x.t}</option>`).join('')}</select>
<div class=row><div><div class=big id=tp></div><div id=tc></div></div><div class=sm id=ti style="text-align:right"></div></div><canvas id=cv></canvas></div>
<div class=card><div class=row><span>Quantity (lot)</span><div class=qty><button onclick="Q(-1)">−</button><input id=qi type=number min=1 value=${S.qty} oninput="S.qty=Math.max(1,parseInt(this.value)||1);upT()"><button onclick="Q(1)">+</button></div></div>
<div class=row><span class=sm>Estimasi total</span><b id=tt></b></div><div class=row><span class=sm>Cash</span><b id=tcash></b></div><div class=row><span class=sm>Kepemilikan</span><span id=th></span></div>
<div class=btns2><button class="b buy" onclick="tr('BUY')">BUY</button><button class="b sell" onclick="tr('SELL')">SELL</button></div></div>`}
function upT(){const s=ST(S.sel),c=(s.p/s.o-1)*100,h=S.hold[s.t];if(!$('tp'))return;$('tp').textContent=fR(s.p);$('tc').className=cl(c);$('tc').textContent=fP(c,1)+' hari ini';$('ti').innerHTML=`${s.name}<br>${s.sec} · β ${s.beta} · vol ${s.vol}`;
 $('tt').textContent=fR(S.qty*s.p);$('tcash').textContent=fR(S.cash);$('th').innerHTML=h?`${h.q} lot · avg ${fR(h.a)} · <span class=${cl(s.p-h.a)}>${fS((s.p-h.a)*h.q)}</span>`:'—'}
function pP(){const m=M(),hs=Object.entries(S.hold);const mt=(a,b,c)=>`<div class=mini><span class=sm>${a}</span><b class=${c||''}>${b}</b></div>`;
 return`<div class=grid2>${mt('Cash Balance',fR(S.cash))}${mt('Portfolio Value',fR(m.pv))}${mt('Total Equity',fR(m.eq))}${mt('Today’s P/L',fS(m.today),cl(m.today))}${mt('Total P/L',fS(m.total),cl(m.total))}</div>
<div class=sec>Holdings</div>${hs.map(([t,h])=>{const s=ST(t),u=(s.p-h.a)*h.q;return`<div class=card onclick="go('trade','${t}')"><div class=row><span style="display:flex;gap:8px;align-items:center">${AV(s)}<b>${t}</b></span><span>${h.q} lot</span></div><div class=row><span class=sm>Average Price</span><span>${fR(h.a)}</span></div><div class=row><span class=sm>Current Price</span><span>${fR(s.p)}</span></div><div class=row><span class=sm>Unrealized P/L</span><b class=${cl(u)}>${fS(u)}</b></div></div>`}).join('')||'<div class=sm>Belum ada saham. Buka TRADE untuk BUY.</div>'}
<div class=sec>Transaction History</div><div class=card><table><tr><th>Waktu</th><th>Tipe</th><th>Kode</th><th>Lot</th><th>Harga</th><th>P/L</th></tr>${S.hist.map(h=>`<tr><td>${h.tm}</td><td class=${h.ty=='BUY'?'up':'dn'}>${h.ty}</td><td>${h.t}</td><td>${h.q}</td><td>${fR(h.p)}</td><td class=${h.pl==null?'':cl(h.pl)}>${h.pl==null?'—':fS(h.pl)}</td></tr>`).join('')||'<tr><td colspan=6 class=sm>Belum ada transaksi.</td></tr>'}</table></div>`}
function pN(){return`<div class=sec>Simulated News</div>${S.news.map(n=>`<div class=nw>${n.t}<div class=sm>${n.tm} · SIMULATED</div></div>`).join('')}`}
const PG={market:pM,watch:pW,trade:pT,portfolio:pP,news:pN,learn:pL},NV=[['market','MARKET'],['watch','WATCHLIST'],['trade','TRADE'],['portfolio','PORTFOLIO'],['news','NEWS'],['learn','BELAJAR']];
function R(){$('main').innerHTML=PG[S.page]();$('main').className=S.page=='trade'?'tr':'';document.body.classList.toggle('tr',S.page=='trade');H();$('nv').innerHTML=NV.map(n=>`<button class="${n[0]==S.page?'on':''}" onclick="go('${n[0]}')"><svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round>${IC[n[0]]}</svg>${n[1]}</button>`).join('');
 if(S.page=='trade')upT();if(S.page=='learn'){calc();qR()}LY()}
function go(p,t){S.page=p;if(t)S.sel=t;R();scrollTo(0,0)}
function Q(d){S.qty=Math.max(1,S.qty+d);$('qi').value=S.qty;upT()}
function tw(t){const i=S.watch.indexOf(t);i<0?S.watch.push(t):S.watch.splice(i,1);R()}
function sc(k){if(API&&ON)api('/api/scenario',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({k})}).catch(()=>{});else setRG(k);R();toast('Skenario: '+k,1)}

const LEARN=[
["1. Dasar Saham & Istilah Penting",["<b>Saham</b> = bukti kepemilikan sebagian kecil sebuah perusahaan. Harga naik-turun mengikuti permintaan (beli) dan penawaran (jual).","<b>Lot</b> = satuan jumlah transaksi. Di bursa Indonesia nyata 1 lot = 100 lembar. Di demo ini 1 lot = 1 unit harga agar mudah dihitung.","<b>Bid</b> = harga beli tertinggi yang antre, <b>Ask</b> = harga jual terendah. Selisihnya disebut spread.","<b>Market cap</b> = harga x jumlah saham beredar (ukuran besar perusahaan). <b>Dividen</b> = pembagian laba ke pemegang saham.","<b>Indeks</b> (seperti VSG di sini) = angka gabungan yang mewakili kondisi pasar secara keseluruhan."]],
["2. Profit, Loss, Lot & Average Price",["<b>P/L</b> = (harga sekarang - harga beli) x jumlah lot. Contoh: beli 4 lot di 2.512.000, harga jadi 2.631.000 → untung 4 x 119.000 = Rp476.000.","<b>Unrealized P/L</b> = untung/rugi di atas kertas (belum dijual). <b>Realized P/L</b> = sudah terkunci setelah SELL.","<b>Average price</b> = rata-rata harga beli bila Anda membeli bertahap. Rumus: total modal dibeli / total lot.","<b>Total Equity</b> = Cash + nilai portfolio. Ini angka sebenarnya kekayaan Anda di simulator.","Rugi 50% butuh untung 100% untuk kembali modal. Itu sebabnya menjaga rugi kecil jauh lebih penting daripada mengejar untung besar."]],
["3. Stop Loss, Take Profit & Risk Reward",["<b>Stop Loss (SL)</b> = batas harga di mana Anda rela keluar dengan rugi kecil agar tidak rugi lebih besar.","<b>Take Profit (TP)</b> = target harga untuk mengunci untung.","<b>Risk:Reward</b> = jarak ke SL dibanding jarak ke TP. Rasio 1:2 artinya risiko 1 untuk potensi untung 2.","<b>Position sizing</b>: tentukan dulu maksimal rugi per transaksi (umumnya 1-2% dari modal), baru hitung jumlah lot. Pakai kalkulator di atas.","Jangan memindahkan SL menjauh hanya karena berharap harga balik. Itu kebiasaan yang paling sering menghancurkan akun."]],
["4. Membaca Candlestick & Chart",["Satu candle = pergerakan harga dalam satu periode: <b>open, high, low, close</b>.","Candle hijau = harga tutup lebih tinggi dari buka (naik). Candle merah/oranye = turun. <b>Body</b> adalah selisih open-close, <b>wick</b> adalah ekor harga tertinggi/terendah.","Wick panjang menandakan harga ditolak di level itu. Body besar menandakan tekanan beli/jual kuat.","<b>Support</b> = area harga yang sering menahan penurunan. <b>Resistance</b> = area yang sering menahan kenaikan.","<b>Trend</b>: naik (puncak dan lembah makin tinggi), turun (makin rendah), atau sideways (bergerak mendatar).","Garis merah-cokelat di chart adalah <b>moving average</b> (rata-rata harga 7 candle terakhir) untuk melihat arah trend."]],
["5. Analisis Teknikal",["Menganalisis harga dan volume dari chart untuk memperkirakan peluang arah berikutnya.","<b>Moving Average (MA)</b>: harga di atas MA cenderung trend naik, di bawah MA cenderung turun.","<b>RSI</b> (0-100): di atas 70 dianggap jenuh beli, di bawah 30 jenuh jual. Bukan sinyal pasti, hanya peringatan.","<b>MACD</b>: membandingkan dua MA untuk melihat momentum dan pembalikan arah.","<b>Breakout</b> = harga menembus resistance, <b>breakdown</b> = menembus support. Waspada false breakout (tembus sebentar lalu balik).","Satu indikator tidak cukup. Gabungkan trend, level support/resistance, dan volume."]],
["6. Analisis Fundamental",["Menilai nilai wajar perusahaan dari kinerja bisnisnya, biasanya untuk investasi jangka menengah-panjang.","<b>EPS</b> = laba bersih per lembar saham. <b>PER</b> = harga / EPS (berapa kali laba yang dibayar pasar).","<b>PBV</b> = harga / nilai buku per saham. <b>ROE</b> = laba dibanding modal sendiri (efisiensi).","<b>DER</b> = utang dibanding modal sendiri. Makin tinggi, makin berisiko saat bunga naik.","Baca laporan keuangan: pendapatan, laba, arus kas, dan utang. Bandingkan dengan perusahaan sejenis dan dengan periode sebelumnya."]],
["7. Cara Berpikir Analisis Data",["Mulai dari <b>hipotesis</b> yang jelas, misalnya: saham dengan beta tinggi naik lebih besar saat VSG rally.","Kumpulkan data, uji, lalu catat hasil. Coba di simulator ini: bandingkan gerak TG40 dan KRYO saat VSG naik.","Buat <b>jurnal trading</b>: alasan masuk, SL/TP, hasil, dan emosi. Dari situ hitung <b>win rate</b> dan <b>expectancy</b> (rata-rata untung per transaksi).","Waspadai bias: <b>confirmation bias</b> (hanya mencari data yang mendukung keyakinan), <b>survivorship bias</b>, dan <b>overfitting</b> (strategi yang cocok hanya pada data masa lalu).","Hasil masa lalu tidak menjamin hasil masa depan. Uji strategi pada banyak kondisi: bullish, bearish, sideways."]],
["8. Memahami Pasar Global",["Bursa utama: NYSE & Nasdaq (AS), London, Frankfurt, Tokyo, Shanghai/Hong Kong, dan Bursa Efek Indonesia.","Pasar saling terhubung: penurunan besar di AS sering diikuti Asia keesokan harinya. Karena itu panel Asia, Europe, dan seterusnya di Market bergerak mengikuti VSG.","Jam buka bergantian mengikuti zona waktu (Asia → Eropa → Amerika), sehingga ada pasar yang aktif hampir sepanjang hari.","<b>Korelasi</b>: harga minyak memengaruhi saham energi, dolar kuat menekan komoditas dan mata uang negara berkembang.","<b>Risk-on</b> = investor berani ambil risiko (saham dan crypto naik). <b>Risk-off</b> = investor lari ke aset aman (emas, obligasi, dolar)."]],
["9. Ekonomi Dunia & Dampaknya",["<b>Suku bunga bank sentral</b>: bunga naik cenderung menekan saham (utang lebih mahal), bunga turun cenderung mendorong pasar.","<b>Inflasi (CPI)</b>: inflasi tinggi biasanya membuat bank sentral menaikkan bunga.","<b>PDB/GDP</b> = ukuran pertumbuhan ekonomi. Dua kuartal berturut-turut menyusut sering disebut resesi.","<b>Data tenaga kerja</b> (misalnya NFP di AS), data ritel, dan neraca perdagangan sering membuat pasar bergerak tajam saat dirilis.","<b>Kurs</b>: pelemahan rupiah menguntungkan eksportir, tetapi membebani perusahaan yang berutang dalam dolar.","Faktor lain: geopolitik, harga energi, rantai pasok, dan kebijakan pemerintah. Pantau kalender ekonomi sebelum trading."]],
["10. Belajar Crypto",["<b>Crypto</b> adalah aset digital yang dicatat di <b>blockchain</b>, buku besar terbuka yang tidak dikendalikan satu pihak. Contoh: Bitcoin dan Ethereum.","Pasar crypto buka <b>24 jam, 7 hari</b>, dan volatilitasnya jauh lebih tinggi dari saham. Naik atau turun 10% dalam sehari bisa terjadi.","<b>Exchange</b> = tempat jual-beli. <b>Wallet</b> = tempat menyimpan. Kehilangan kunci pribadi (private key) berarti kehilangan aset.","Hati-hati penipuan: janji profit pasti, skema investasi bodong, link palsu, dan koin tanpa fungsi jelas.","Hindari leverage tinggi. Leverage melipatgandakan untung sekaligus rugi dan bisa membuat posisi dilikuidasi.","Cek legalitas platform dan aturan di negara Anda sebelum memakai uang asli."]],
["11. Trading vs Investasi",["<b>Day trading</b>: buka-tutup posisi dalam hari yang sama. Cepat, stres tinggi, biaya transaksi terasa.","<b>Swing trading</b>: menahan hari sampai minggu. <b>Investasi</b>: menahan bulan sampai tahun berdasarkan fundamental.","<b>Leverage/margin</b> = trading dengan dana pinjaman. Risiko rugi bisa melebihi perkiraan Anda.","<b>Diversifikasi</b>: jangan menaruh semua modal di satu saham atau satu sektor.","Gunakan hanya dana yang siap hilang untuk trading. Dana darurat dan kebutuhan hidup tidak boleh dipakai."]],
["12. Psikologi Trader",["<b>FOMO</b>: membeli karena takut ketinggalan saat harga sudah melonjak.","<b>Panic selling</b>: menjual rugi karena panik saat pasar turun tajam.","<b>Revenge trading</b>: langsung membuka posisi besar untuk membalas kerugian, biasanya memperburuk keadaan.","Buat aturan tertulis (rencana trading) lalu patuhi: kapan masuk, kapan keluar, berapa risiko.","Mulai dari ukuran kecil dan latihan konsisten di simulator sebelum memikirkan uang asli."]],
["13. Belajar Emas & Aset Aman",["Emas dikenal sebagai <b>safe haven</b> (aset lindung nilai): sering dicari saat ekonomi tidak pasti, inflasi tinggi, perang, atau pasar saham turun.","Harga emas dunia dalam <b>USD per troy ounce</b> (1 oz = 31,1 gram). Harga per gram dalam rupiah = (USD/oz x kurs) / 31,1. Jadi rupiah melemah bisa membuat emas lokal naik meski emas dunia datar.","<b>Pendorong harga:</b> suku bunga AS (bunga naik biasanya menekan emas karena emas tidak memberi bunga), kekuatan dolar AS, inflasi, geopolitik, dan pembelian emas oleh bank sentral.","<b>Korelasi:</b> emas sering bergerak berlawanan dengan saham saat risk-off. Di simulator ini XAU memakai beta negatif terhadap VSG. Di dunia nyata hubungan ini tidak selalu berlaku, emas bisa turun bersamaan dengan saham.","<b>Risiko:</b> bisa turun atau mendatar bertahun-tahun, tidak ada dividen atau bunga, selisih harga beli-jual (spread) pada emas fisik, leverage pada kontrak/CFD yang sangat berbahaya, dan penipuan investasi emas bodong.","<b>Cara memiliki:</b> emas fisik, tabungan emas, ETF, atau kontrak berjangka. Bandingkan biaya, keamanan penyimpanan, dan legalitas penyedia.","Banyak investor memakai emas sebagai porsi kecil portofolio untuk diversifikasi, bukan sebagai satu-satunya aset."]],
["14. Latihan di VERCH MARKET",["Lihat kondisi VSG di header (BULLISH, BEARISH, dan seterusnya). Cocokkan dengan arah saham.","Pakai tombol Market Rally atau Market Correction di MARKET lalu amati saham beta tinggi (KRYO, ARVX) vs beta rendah (VERA).","BUY 1 lot, tentukan SL dan TP versi Anda, lalu tunggu. Catat hasilnya di jurnal.","Coba skenario sideways: apakah strategi trend-following Anda masih untung?","Cek Transaction History di PORTFOLIO untuk mengevaluasi keputusan Anda."]]];
